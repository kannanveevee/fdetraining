<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Patient Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background-color: #eef2f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #222222;
        }

        #app-header {
            background-color: #b9d9f5;
            border-bottom: 2px solid #333333;
            padding: 10px 14px;
            font-size: 18px;
            font-weight: bold;
        }

        #encounter-form {
            padding: 20px 30px 24px;
        }

        #form-title {
            margin: 0 0 24px;
            color: #3a6fb0;
            font-size: 18px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            max-width: 260px;
            padding: 8px 10px;
            font-size: 15px;
            border: 1.5px solid #333333;
            border-radius: 3px;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group select {
            max-width: 160px;
            cursor: pointer;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #3a6fb0;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3a6fb0;
            box-shadow: 0 0 0 3px rgba(58, 111, 176, 0.25);
        }

        .form-actions {
            text-align: left;
            margin-top: 10px;
        }

        #add-btn {
            padding: 9px 28px;
            font-size: 16px;
            background-color: #ffffff;
            color: #222222;
            border: 1.5px solid #333333;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #add-btn:hover {
            background-color: #3a6fb0;
            border-color: #3a6fb0;
            color: #ffffff;
        }

        #add-btn:active {
            background-color: #2c5689;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header id="app-header">Diabetes Patient Management</header>

        <form id="encounter-form">
            <h2 id="form-title">Add Patient Encounter</h2>

            <div class="form-group">
                <label for="patient-number">Patient Number</label>
                <input type="number" id="patient-number" name="patient_number" min="1" required>
            </div>

            <div class="form-group">
                <label for="age-group">Age</label>
                <select id="age-group" name="age_group" required>
                    <option value="">Age Group</option>
                    <option value="[0-10)">0 - 10</option>
                    <option value="[10-20)">10 - 20</option>
                    <option value="[20-30)">20 - 30</option>
                    <option value="[30-40)">30 - 40</option>
                    <option value="[40-50)">40 - 50</option>
                    <option value="[50-60)">50 - 60</option>
                    <option value="[60-70)">60 - 70</option>
                    <option value="[70-80)">70 - 80</option>
                    <option value="[80-90)">80 - 90</option>
                    <option value="[90-100)">90 - 100</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time-in-hospital">Time in Hospital (days)</label>
                <input type="number" id="time-in-hospital" name="time_in_hospital" min="0" required>
            </div>

            <div class="form-group">
                <label for="inpatient-visits">Inpatient Visits</label>
                <input type="number" id="inpatient-visits" name="number_inpatient" min="0" required>
            </div>

            <div class="form-group">
                <label for="emergency-visits">Emergency Visits</label>
                <input type="number" id="emergency-visits" name="number_emergency" min="0" required>
            </div>

            <div class="form-group">
                <label for="medications">Medications</label>
                <input type="number" id="medications" name="num_medications" min="0" required>
            </div>

            <div class="form-actions">
                <button type="submit" id="add-btn">Add Encounter</button>
            </div>
        </form>
    </div>

    <!-- JavaScript Execution -->
    <script>
        async function loadPatients() {
            try {
                const response = await fetch("http://127.0.0.1:8000/encounters");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const patients = await response.json();
                console.log(patients);


                // Populate patient rows dynamically
                document.getElementById('encounter-list').innerHTML = patients.map(patient => `
                    <tr>
                        <td>${patient.patient_nbr}</td>
                        <td>${patient.age}</td>
                        <td>${patient.risk_score}</td>
                        <td>${patient.risk_level}</td>
                    </tr>
                `).join('');


            } catch (error) {
                console.error("Error loading patient data:", error);
            }
        }


        // Load the page with the patient encounters when the DOM is fully loaded
        window.addEventListener('DOMContentLoaded', (event) => {
            loadPatients();
        });
    </script>

</body>
</html>
