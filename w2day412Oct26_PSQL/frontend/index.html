<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Patient Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            background-color: #eef2f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #222222;
        }

        #app-header {
            background-color: #b9d9f5;
            border-bottom: 2px solid #333333;
            padding: 10px 14px;
            font-size: 18px;
            font-weight: bold;
        }

        #encounter-form {
            padding: 20px 30px 24px;
        }

        #form-title {
            margin: 0 0 24px;
            color: #3a6fb0;
            font-size: 18px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            max-width: 260px;
            padding: 8px 10px;
            font-size: 15px;
            border: 1.5px solid #333333;
            border-radius: 3px;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Hide the up/down arrows of number inputs; values are typed in. */
        .form-group input[type="number"]::-webkit-outer-spin-button,
        .form-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .form-group input[type="number"] {
            -moz-appearance: textfield;   /* Firefox */
            appearance: textfield;
        }

        .form-group select {
            max-width: 160px;
            cursor: pointer;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #3a6fb0;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3a6fb0;
            box-shadow: 0 0 0 3px rgba(58, 111, 176, 0.25);
        }

        .form-actions {
            text-align: left;
            margin-top: 10px;
        }

        #add-btn {
            padding: 9px 28px;
            font-size: 16px;
            background-color: #ffffff;
            color: #222222;
            border: 1.5px solid #333333;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #add-btn:hover {
            background-color: #3a6fb0;
            border-color: #3a6fb0;
            color: #ffffff;
        }

        #add-btn:active {
            background-color: #2c5689;
        }

        #add-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #form-message {
            margin: 0 30px 16px;
            min-height: 20px;
            font-size: 15px;
        }

        #form-message.success {
            color: #1d7a3a;
        }

        #form-message.error {
            color: #b3261e;
        }

        #saved-section {
            padding: 0 30px 24px;
        }

        #saved-title {
            margin: 0 0 12px;
            color: #3a6fb0;
            font-size: 18px;
            font-weight: normal;
        }

        .table-wrap {
            overflow-x: auto;
        }

        #encounter-table {
            border-collapse: collapse;
            background-color: #ffffff;
            font-size: 14px;
        }

        #encounter-table th,
        #encounter-table td {
            border: 1px solid #999999;
            padding: 6px 10px;
            text-align: left;
            white-space: nowrap;
        }

        #encounter-table th {
            background-color: #b9d9f5;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header id="app-header">Diabetes Patient Management</header>

        <form id="encounter-form">
            <h2 id="form-title">Add Patient Encounter</h2>

            <div class="form-group">
                <label for="patient-number">Patient Number</label>
                <input type="number" id="patient-number" name="patient_number" min="1" required>
            </div>

            <div class="form-group">
                <label for="age-group">Age</label>
                <select id="age-group" name="age_group" required>
                    <option value="">Age Group</option>
                    <option value="[0-10)">0 - 10</option>
                    <option value="[10-20)">10 - 20</option>
                    <option value="[20-30)">20 - 30</option>
                    <option value="[30-40)">30 - 40</option>
                    <option value="[40-50)">40 - 50</option>
                    <option value="[50-60)">50 - 60</option>
                    <option value="[60-70)">60 - 70</option>
                    <option value="[70-80)">70 - 80</option>
                    <option value="[80-90)">80 - 90</option>
                    <option value="[90-100)">90 - 100</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time-in-hospital">Time in Hospital (days)</label>
                <input type="number" id="time-in-hospital" name="time_in_hospital" min="0" required>
            </div>

            <div class="form-group">
                <label for="inpatient-visits">Inpatient Visits</label>
                <input type="number" id="inpatient-visits" name="number_inpatient" min="0" required>
            </div>

            <div class="form-group">
                <label for="emergency-visits">Emergency Visits</label>
                <input type="number" id="emergency-visits" name="number_emergency" min="0" required>
            </div>

            <div class="form-group">
                <label for="medications">Medications</label>
                <input type="number" id="medications" name="num_medications" min="0" required>
            </div>

            <div class="form-actions">
                <button type="submit" id="add-btn">Add Encounter</button>
            </div>
        </form>

        <p id="form-message" role="status"></p>

        <section id="saved-section">
            <h2 id="saved-title">Saved Encounters (read back with GET /encounters/{id})</h2>
            <div class="table-wrap">
                <table id="encounter-table">
                    <thead>
                        <tr>
                            <th>Encounter ID</th>
                            <th>Patient Number</th>
                            <th>Age</th>
                            <th>Days in Hospital</th>
                            <th>Inpatient</th>
                            <th>Emergency</th>
                            <th>Medications</th>
                            <th>Risk Score</th>
                            <th>Risk Level</th>
                        </tr>
                    </thead>
                    <tbody id="encounter-list"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- JavaScript Execution.
         dist/api.js is built from api.ts: run "npm run build" in this folder first.
         Serve this folder with "python -m http.server 5500" and open http://127.0.0.1:5500
         (a module script does not load from file://, and CORS only allows port 5500). -->
    <script type="module">
        import { createEncounter, getEncounter } from "./dist/api.js";

        const form = document.getElementById("encounter-form");
        const addButton = document.getElementById("add-btn");
        const message = document.getElementById("form-message");
        const encounterList = document.getElementById("encounter-list");

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = kind;
        }

        // Read the form into the body that POST /encounters expects.
        function readForm() {
            const number = (id) => Number(document.getElementById(id).value);
            return {
                patient_nbr: number("patient-number"),
                age: document.getElementById("age-group").value,
                time_in_hospital: number("time-in-hospital"),
                number_inpatient: number("inpatient-visits"),
                number_emergency: number("emergency-visits"),
                num_medications: number("medications"),
            };
        }

        // Add one encounter as the top row of the table.
        // textContent is used (not innerHTML), so values are shown as plain text.
        function addRow(encounter) {
            const row = document.createElement("tr");
            const values = [
                encounter.encounter_id,
                encounter.patient_nbr,
                encounter.age,
                encounter.time_in_hospital,
                encounter.number_inpatient,
                encounter.number_emergency,
                encounter.num_medications,
                encounter.risk_score,
                encounter.risk_level,
            ];
            for (const value of values) {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            }
            encounterList.prepend(row);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();   // stop the browser from reloading the page
            addButton.disabled = true;
            showMessage("Saving...", "");

            try {
                // 1. POST /encounters saves the encounter in PostgreSQL.
                const created = await createEncounter(readForm());

                // 2. GET /encounters/{id} reads it back, so the table shows what is stored.
                const saved = await getEncounter(created.encounter_id);
                if (saved === null) {
                    throw new Error(`Encounter ${created.encounter_id} was not found after saving.`);
                }

                addRow(saved);
                console.log("POST response:", created, "GET response:", saved);
                showMessage(
                    `Encounter ${saved.encounter_id} saved. Risk: ${saved.risk_level} (score ${saved.risk_score}).`,
                    "success"
                );
                form.reset();
            } catch (error) {
                console.error(error);
                const text = error.message === "Failed to fetch"
                    ? "Could not reach the API at http://127.0.0.1:8000. Is uvicorn running?"
                    : error.message;
                showMessage(text, "error");
            } finally {
                addButton.disabled = false;
            }
        });
    </script>

</body>
</html>
